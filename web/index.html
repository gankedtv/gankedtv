<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GankedTV</title>
    <!-- Site-wide link-preview fallback for pages without a crawler-specific answer (home,
         profiles, …). Clip share paths get richer server-rendered OG tags via the Caddyfile's
         crawler routes. No og:image: it must be an absolute URL and this shell is
         environment-agnostic (no baked origin); title/description cards render fine without. -->
    <meta name="description" content="Watch and share the best gaming clips on GankedTV.">
    <meta property="og:site_name" content="GankedTV">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GankedTV">
    <meta property="og:description" content="Watch and share the best gaming clips on GankedTV.">
    <meta name="twitter:card" content="summary">
    <!-- Runtime config: the production image's entrypoint overwrites /config.js from container env
         before Caddy serves it, so the same bundle works in any environment. Blocking + ahead of the
         module script so window.__APP_CONFIG__ is set first. The committed default (public/config.js)
         is empty, so dev/local falls back to import.meta.env (see src/config.ts). -->
    <script src="/config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
