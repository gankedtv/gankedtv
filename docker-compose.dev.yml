services:
  postgres:
    image: postgres:18
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: gankedtv
      POSTGRES_USER: gankedtv
      POSTGRES_PASSWORD: gankedtv_dev
      # Pin PGDATA to a subdir so the data path is stable across major-version
      # bumps (the upstream default changes per major) and avoids PG's refusal
      # to init into a non-empty mount root.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gankedtv -d gankedtv"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
