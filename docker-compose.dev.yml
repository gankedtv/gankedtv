services:
  postgres:
    image: postgres:18
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: gankedtv
      POSTGRES_USER: gankedtv
      POSTGRES_PASSWORD: gankedtv_dev
      # Pin PGDATA to a subdir so the data path is stable across major-version
      # bumps (the upstream default changes per major) and avoids PG's refusal
      # to init into a non-empty mount root.
      #
      # MIGRATION NOTE: existing developers upgrading from the pre-PG18 layout
      # have data at the volume root (`/var/lib/postgresql/data`), not the new
      # `/pgdata` subdir — Postgres will treat the new path as empty and re-init
      # a fresh cluster, leaving the old files orphaned. Local seed data is
      # throwaway, so the canonical fix is `make clean && make up && make
      # migrate && make seed`. If you have local data worth keeping, exec into
      # the running container and `mv /var/lib/postgresql/data/{base,pg_*,*}
      # /var/lib/postgresql/data/pgdata/` before restarting.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gankedtv -d gankedtv"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dev intentionally stays on the (archived but functional) community MinIO: it needs no license and
  # keeps `make up`/`make seed` zero-config for throwaway local data. Production uses its maintained
  # successor AIStor — see docker-compose.prod.yml and DEPLOYMENT.md.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Discord bot — off-by-default. Gated behind the `discord` compose profile so
  # `make up` (plain dev) doesn't build the Bun image until you opt in with
  # `make up-discord`. Without DISCORD_BOT_TOKEN the container still no-ops
  # cleanly — the profile gate is purely a build-time skip.
  discord:
    profiles: ["discord"]
    build:
      # Repo-root context so the image can COPY the shared/ module the bot imports (see
      # discord/Dockerfile). A repo-root .dockerignore keeps the context lean.
      context: .
      dockerfile: discord/Dockerfile
    environment:
      # Distinct from the API's DATABASE_URL because the API uses dotnet
      # semicolon form, which porsager's `postgres` driver can't parse.
      DISCORD_DATABASE_URL: postgres://gankedtv:gankedtv_dev@postgres:5432/gankedtv
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_APP_ID: ${DISCORD_BOT_APP_ID:-}
      DISCORD_BOT_GUILD_ID: ${DISCORD_BOT_GUILD_ID:-}
      DISCORD_POLL_INTERVAL_SECONDS: ${DISCORD_POLL_INTERVAL_SECONDS:-30}
      # Inside the docker network the API is reachable via host.docker.internal
      # (since the API runs on the host via `dotnet watch`, not in compose).
      # `bun dev` from the discord/ directory uses a local .env to talk to
      # http://localhost:5050 directly.
      GANKEDTV_API_BASE: ${GANKEDTV_API_BASE:-http://host.docker.internal:5050}
      GANKEDTV_PUBLIC_BASE: ${GANKEDTV_PUBLIC_BASE:-http://localhost:5173}
    # Native Linux Docker doesn't auto-resolve host.docker.internal (only Docker
    # Desktop / WSL2 do); the host-gateway alias is the cross-platform way to
    # let the container reach the host-running API. Without this the in-container
    # bot can't hit GANKEDTV_API_BASE in dev on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  redis_data:
