version: 2
updates:
  # server/ — .NET / NuGet. One PR for all updates (major included).
  - package-ecosystem: "nuget"
    directory: "/server"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:server"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      server:
        patterns:
          - "*"

  # web/ — Vue app (Bun). One PR for all updates (major included).
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:web"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      web:
        patterns:
          - "*"

  # discord/ — bot (Bun). One PR for all updates (major included).
  - package-ecosystem: "bun"
    directory: "/discord"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:discord"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      discord:
        patterns:
          - "*"

  # docker — Dockerfile base images across all three apps. One combined PR.
  - package-ecosystem: "docker"
    directories:
      - "/server"
      - "/web"
      - "/discord"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:docker"
    commit-message:
      prefix: "chore"
    groups:
      docker:
        patterns:
          - "*"

  # CI — GitHub Actions (docker/*, actions/*). One PR for all updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:ci"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
