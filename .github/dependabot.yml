version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/server"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:server"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:web"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "area:ci"
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
