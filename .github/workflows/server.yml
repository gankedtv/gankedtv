name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  # Reusable: release.yml calls this on push to main to gate image publishing on the tests passing.
  # (No standalone push:main trigger — release.yml orchestrates main so tests don't run twice.)
  workflow_call:

concurrency:
  # Static, stack-specific group so it never collides with the caller's group when invoked via
  # workflow_call (github.workflow resolves to the CALLER there, not "Server").
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  format:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

  test:
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install ffmpeg
        # Required by the thumbnail worker round-trip test (ThumbnailRoundTripTests),
        # which generates a tiny test mp4 + runs the real worker against MinIO via
        # Testcontainers. The rest of the suite stubs IFfmpegRunner.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: |
          set -o pipefail
          dotnet test \
            --configuration Release \
            --verbosity normal \
            /p:CollectCoverage=true \
            /p:Threshold=85%2C85 \
            | tee "$RUNNER_TEMP/server-cov.txt"

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Server coverage (line + branch)"
            echo
            echo '```'
            grep -E '^[+|]' "$RUNNER_TEMP/server-cov.txt" || echo '(no coverage table captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
