name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads source and builds/tests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # On push to main, the prebuild pulls VITE_* from Vaultwarden's PROD collection; on PRs
          # these are blank so it no-ops and the committed .env is used (PR CI stays independent of
          # the vault). Needs ENABLE_GITHUB_IP_RANGES on the API to whitelist runner IPs.
          VAULTWARDEN_API_URL: ${{ github.event_name == 'push' && secrets.VAULTWARDEN_API_URL || '' }}
          VAULTWARDEN_API_KEY: ${{ github.event_name == 'push' && secrets.VAULTWARDEN_API_KEY || '' }}
          ASPNETCORE_ENVIRONMENT: ${{ github.event_name == 'push' && 'Production' || '' }}

  format:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:check

  test:
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          summary="coverage/coverage-summary.json"
          if [ -f "$summary" ]; then
            jq -r '
              .total |
              "## Web coverage (scoped: src/api, src/router, src/stores)\n\n"
              + "| Metric   | %     | Covered / Total |\n"
              + "|----------|-------|-----------------|\n"
              + "| Lines    | \(.lines.pct)%    | \(.lines.covered)/\(.lines.total) |\n"
              + "| Branches | \(.branches.pct)% | \(.branches.covered)/\(.branches.total) |"
            ' "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Web coverage"
              echo "(coverage-summary.json not found)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
