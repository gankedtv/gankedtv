name: Release

# On push to main: run the per-stack CI (reusable server.yml / web.yml / discord.yml) for whatever
# changed, then build + push ONLY the images whose tests passed to GHCR, tagged with the full commit
# SHA. A final `promote` job then flips the :latest deploy tag for every image built in this release
# AT ONCE, and only once all of them built — so a partial or failed release never moves any :latest,
# and production never pulls one image ahead of the others. No deploy step of our own: an auto-updater
# on the host (Watchtower / freshdock) pulls the moved :latest tags. The change filter avoids touching
# images whose sources didn't change; their existing :latest still points at the correct digest.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'web/**'
      - 'discord/**'
      - 'shared/**'
      - '.dockerignore'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abort a half-published release

# Least-privilege: read-only by default; only the publish jobs below get packages: write.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      discord: ${{ steps.filter.outputs.discord }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/release.yml'
            web:
              - 'web/**'
              - 'shared/**'
              - '.dockerignore'        # root context allowlist for the web image
              - '.github/workflows/release.yml'
            discord:
              - 'discord/**'
              - 'shared/**'
              - '.dockerignore'        # root context allowlist for the discord image
              - '.github/workflows/release.yml'

  # --- Gate: run each changed stack's full CI; a publish job below only runs if its test job passed.
  test-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml
    secrets: inherit
  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
    secrets: inherit
  test-discord:
    needs: changes
    if: needs.changes.outputs.discord == 'true'
    uses: ./.github/workflows/discord.yml
    secrets: inherit

  # --- Publish: each build needs its test job, so a failing suite blocks that image's release.
  server:
    needs: [changes, test-server]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gankedtv-server
          # :latest is deferred to the promote job so all changed images flip together.
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v7
        with:
          context: server # server/-scoped: Dockerfile.api COPYs GankedTV.slnx + src/ relative to server/
          file: server/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  web:
    needs: [changes, test-web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gankedtv-web
          # :latest is deferred to the promote job so all changed images flip together.
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v7
        with:
          context: . # repo root: web build needs web/ + shared/ (see web/Dockerfile + .dockerignore)
          file: web/Dockerfile
          push: true
          # No build-args: the bundle is environment-agnostic. Per-deployment VITE_* are injected at
          # container start (web/docker-entrypoint.sh), so this one image works for every deployment.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  discord:
    needs: [changes, test-discord]
    if: needs.changes.outputs.discord == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gankedtv-discord
          # :latest is deferred to the promote job so all changed images flip together.
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v7
        with:
          context: . # repo root: discord/Dockerfile COPYs shared/
          file: discord/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord
          cache-to: type=gha,scope=discord,mode=max

  # Private encoder image for the GPU box: gankedtv-server + NVENC ffmpeg. Built FROM the
  # exact server image published above (same commit), and only when server/ changed — so it tracks
  # server and its tests gate it (needs: server). Keep its GHCR package PRIVATE; it's only for the
  # dedicated encoder host. See server/Dockerfile.dedicated-encoder + DEPLOYMENT.md.
  dedicated-encoder:
    needs: [changes, server]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/gankedtv-dedicated-encoder
          # :latest is deferred to the promote job so all changed images flip together.
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v7
        with:
          context: server # unused (the Dockerfile only layers ffmpeg onto the base), mirrors the api job
          file: server/Dockerfile.dedicated-encoder
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gankedtv-server:${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dedicated-encoder
          cache-to: type=gha,scope=dedicated-encoder,mode=max

  # --- Promote: move the :latest deploy tag for every image built in THIS release to its fresh
  # :<sha>, all in one job that waits on every build. Runs only if no test or build job failed, so a
  # partial release never moves any :latest — production either sees the whole new set or the whole
  # old set, never a mix. Retag is a server-side manifest copy (imagetools), so no image is pulled and
  # all tags flip within seconds of each other. Each per-image step is guarded by the change filter,
  # so only the images that actually rebuilt are promoted; unchanged images keep their existing :latest.
  promote:
    needs:
      - changes
      - test-server
      - test-web
      - test-discord
      - server
      - web
      - discord
      - dedicated-encoder
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.server == 'true'
      || needs.changes.outputs.web == 'true'
      || needs.changes.outputs.discord == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      SHA: ${{ github.sha }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote server + dedicated-encoder
        if: needs.changes.outputs.server == 'true'
        run: |
          for img in gankedtv-server gankedtv-dedicated-encoder; do
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${img}:latest" \
              "ghcr.io/${OWNER}/${img}:${SHA}"
          done
      - name: Promote web
        if: needs.changes.outputs.web == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/gankedtv-web:latest" \
            "ghcr.io/${OWNER}/gankedtv-web:${SHA}"
      - name: Promote discord
        if: needs.changes.outputs.discord == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/gankedtv-discord:latest" \
            "ghcr.io/${OWNER}/gankedtv-discord:${SHA}"
