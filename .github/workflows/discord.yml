name: Discord

on:
  pull_request:
    branches: [main]
    paths:
      - 'discord/**'
      - 'shared/**'
      - '.github/workflows/discord.yml'
  # Reusable: release.yml calls this on push to main to gate image publishing on the tests passing.
  # (No standalone push:main trigger — release.yml orchestrates main so tests don't run twice.)
  workflow_call:

concurrency:
  # Static, stack-specific group so it never collides with the caller's group when invoked via
  # workflow_call (github.workflow resolves to the CALLER there, not "Discord").
  group: ci-discord-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the workflow's GITHUB_TOKEN. The discord workflow
# only reads source and runs tests — no writes back to the repo, no comments on
# PRs, no package publishes. If a step ever needs more, scope it locally with a
# job- or step-level `permissions:` block rather than relaxing this one.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: discord/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

  format:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: discord/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:check

  test:
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: discord/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test with coverage (enforces 85% line / 85% function)
        run: bun run test:coverage
